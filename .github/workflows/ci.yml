name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm test

      - name: Build client
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build
        run: npm run build:client

      - name: Build server
        run: npm run build:server

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t waypoint:test \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_ANON_KEY=dummy-anon-key-for-ci-build \
            .

      - name: Test Docker container starts
        run: |
          docker run -d --name test-container \
            -e SUPABASE_URL="https://example.supabase.co" \
            -e SUPABASE_SERVICE_KEY="dummy-service-key" \
            -e ENCRYPTION_KEY="dummy-encryption-key-for-testing-purposes" \
            -p 3001:3001 waypoint:test
          sleep 10
          curl -f http://localhost:3001/api/health || (docker logs test-container && exit 1)
          docker stop test-container
