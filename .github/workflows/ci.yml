name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build client
        run: npm run build:client

      - name: Build server
        run: npm run build:server

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: test-and-build
    # Only run docker build if the Node 20 tests pass (as Dockerfile uses Node 20)
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t waypoint:test .

      - name: Test Docker container starts
        run: |
          docker run -d --name test-container \
            -e SUPABASE_URL="https://example.supabase.co" \
            -e SUPABASE_SERVICE_KEY="dummy-service-key" \
            -e ENCRYPTION_KEY="dummy-encryption-key-for-testing-purposes" \
            -p 3001:3001 waypoint:test
          sleep 10
          curl -f http://localhost:3001/api/health || (docker logs test-container && exit 1)
          docker stop test-container